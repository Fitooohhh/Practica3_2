services:
  app:
    build: .
    image: ${DOCKERHUB_USERNAME:-local}/portfolio-personal:latest
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://portfolio:portfolio@db:5432/portfolio
    ports:
      - "80:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
